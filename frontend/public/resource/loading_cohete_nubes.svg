<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cargando">
  <circle cx="32" cy="32" r="23" fill="none" stroke="#d1d5db" stroke-opacity=".28" stroke-width="3.5"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="1.35s" repeatCount="indefinite"/>
    <!-- Smoke trail follows the rocket, never overlaps its nose -->
    <path d="M32 9 A23 23 0 0 0 9 32" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    <path d="M32 9 A23 23 0 0 0 15.7 15.7" fill="none" stroke="#e5e7eb" stroke-width="5" stroke-linecap="round" opacity=".75"/>
    <g fill="#b9bec6" opacity=".8">
      <circle cx="23" cy="11" r="2.5"/><circle cx="18.8" cy="14" r="2"/><circle cx="15" cy="18.3" r="2.6"/>
    </g>
    <!-- Rocket at the leading tip of the clockwise rotation -->
    <g transform="translate(32 9) rotate(90)">
      <path d="M-3.5 6 L-7 11 L-3 9 Z M3.5 6 L7 11 L3 9 Z" fill="#dc5663"/>
      <path d="M-4.1 8 L-4.1 0 Q0 -9 4.1 0 L4.1 8 Q0 11 -4.1 8Z" fill="#f5f6f8" stroke="#677180" stroke-width=".8"/>
      <path d="M-3.7 -.7 Q0 -8.6 3.7 -.7Z" fill="#e15c68"/>
      <circle cx="0" cy="3.3" r="2.1" fill="#7baecb" stroke="#53687b" stroke-width=".5"/>
      <path d="M-1.8 9.2 Q0 14 1.8 9.2" fill="#ffad4d"/>
    </g>
  </g>
</svg>
